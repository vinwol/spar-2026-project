<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" font-family="Helvetica, Arial, sans-serif"><title>Factor structure</title><defs><marker id="structure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1180" height="610" fill="#FFFFFF"/><text xml:space="preserve" x="20" y="34" font-size="20" font-weight="bold" fill="#222" text-anchor="start">Factor structure: what is independent, what is paired</text><text xml:space="preserve" x="20" y="54" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">Lines go from a factor down to what is nested in it. Two lines into one box = crossed. Thick box = independent unit; grey = not independent.</text><rect x="20" y="76" width="540" height="430" rx="12" fill="none" stroke="#C77F00" stroke-width="1.4" stroke-dasharray="7 4"/><text xml:space="preserve" x="32" y="92" font-size="11" font-weight="bold" fill="#C77F00" text-anchor="start">Conditions A, B: fresh episodes (the model acts on its own)</text><rect x="110" y="120" width="360" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text xml:space="preserve" x="290" y="141" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Condition (6)</text><text xml:space="preserve" x="290" y="158" font-size="11" font-weight="normal" fill="#666666" text-anchor="middle">fixed treatment factor, not randomised</text><line x1="290" y1="170" x2="290" y2="214" stroke="#222222" stroke-width="1.6"/><rect x="110" y="214" width="360" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="3.2"/><text xml:space="preserve" x="290" y="235" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Episode (23 planned, 24 run)</text><text xml:space="preserve" x="290" y="252" font-size="11" font-weight="normal" fill="#666666" text-anchor="middle">own seed; nested in its condition</text><rect x="426" y="204" width="39.6" height="20" rx="10" fill="#FFFFFF" stroke="#222222"/><text xml:space="preserve" x="446" y="218" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">unit</text><line x1="290" y1="264" x2="290" y2="308" stroke="#222222" stroke-width="1.6"/><rect x="110" y="308" width="360" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text xml:space="preserve" x="290" y="329" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Report branch A | B (2 per episode)</text><text xml:space="preserve" x="290" y="346" font-size="11" font-weight="normal" fill="#666666" text-anchor="middle">crossed with episode = paired</text><line x1="478" y1="320" x2="478" y2="346" stroke="#222222" stroke-width="2"/><line x1="483" y1="320" x2="483" y2="346" stroke="#222222" stroke-width="2"/><text xml:space="preserve" x="40" y="390" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">Planned counts come from the design; one extra low-effort probe</text><text xml:space="preserve" x="40" y="406" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">episode was run for prohibited. Reasoning effort is kept apart.</text><text xml:space="preserve" x="40" y="426" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Analysis: proportions over episodes per condition;</text><text xml:space="preserve" x="40" y="444" font-size="12" font-weight="normal" fill="#222" text-anchor="start">A vs. B compared within each episode (paired counts).</text><text xml:space="preserve" x="40" y="466" font-size="12" font-weight="bold" fill="#222" text-anchor="start">Independent units: episodes.</text><rect x="600" y="76" width="560" height="430" rx="12" fill="none" stroke="#B8579A" stroke-width="1.4" stroke-dasharray="7 4"/><text xml:space="preserve" x="612" y="92" font-size="11" font-weight="bold" fill="#B8579A" text-anchor="start">Conditions C: replayed access</text><rect x="620" y="120" width="250" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text xml:space="preserve" x="745" y="141" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Condition (3)</text><text xml:space="preserve" x="745" y="158" font-size="11" font-weight="normal" fill="#666666" text-anchor="middle">fixed treatment factor</text><rect x="890" y="120" width="250" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="3.2"/><text xml:space="preserve" x="1015" y="141" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Source history (3)</text><text xml:space="preserve" x="1015" y="158" font-size="11" font-weight="normal" fill="#666666" text-anchor="middle">saved run that opened the file</text><rect x="1096" y="110" width="39.6" height="20" rx="10" fill="#FFFFFF" stroke="#222222"/><text xml:space="preserve" x="1116" y="124" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">unit</text><line x1="745" y1="170" x2="880" y2="214" stroke="#222222" stroke-width="1.6"/><line x1="1015" y1="170" x2="880" y2="214" stroke="#222222" stroke-width="1.6"/><rect x="700" y="214" width="360" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text xml:space="preserve" x="880" y="235" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Condition × history (9 cells)</text><text xml:space="preserve" x="880" y="252" font-size="11" font-weight="normal" fill="#666666" text-anchor="middle">every history is used in every condition (block)</text><line x1="880" y1="264" x2="880" y2="308" stroke="#222222" stroke-width="1.6"/><rect x="700" y="308" width="360" height="50" rx="8" fill="#EDEDED" stroke="#999999" stroke-width="1.4"/><text xml:space="preserve" x="880" y="329" font-size="12.5" font-weight="bold" fill="#555555" text-anchor="middle">Sampled continuation</text><text xml:space="preserve" x="880" y="346" font-size="11" font-weight="normal" fill="#666666" text-anchor="middle">×3 or ×7 per cell; differ only by seed</text><line x1="880" y1="358" x2="880" y2="386" stroke="#222222" stroke-width="1.6"/><rect x="700" y="386" width="360" height="50" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text xml:space="preserve" x="880" y="407" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">Report branch A | B (2 per continuation)</text><text xml:space="preserve" x="880" y="424" font-size="11" font-weight="normal" fill="#666666" text-anchor="middle">crossed with continuation = paired</text><line x1="1068" y1="398" x2="1068" y2="424" stroke="#222222" stroke-width="2"/><line x1="1073" y1="398" x2="1073" y2="424" stroke="#222222" stroke-width="2"/><text xml:space="preserve" x="620" y="462" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Analysis: counts per source history (3 independent units);</text><text xml:space="preserve" x="620" y="480" font-size="12" font-weight="normal" fill="#222" text-anchor="start">continuations show response variability for the same history.</text><text xml:space="preserve" x="620" y="498" font-size="12" font-weight="bold" fill="#222" text-anchor="start">Independent units: the 3 source histories.</text><text xml:space="preserve" x="20" y="540" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Held fixed in every unit</text><line x1="20" y1="546" x2="1160" y2="546" stroke="#CCCCCC" stroke-width="1"/><text xml:space="preserve" x="20" y="562" font-size="12" font-weight="normal" fill="#222" text-anchor="start">model and sampling: qwen3.8-27b · DeepInfra bf16 · T=0.6 · top-p 0.95</text><text xml:space="preserve" x="20" y="580" font-size="12" font-weight="normal" fill="#222" text-anchor="start">shared wording: identical outside the manipulated sentences</text><text xml:space="preserve" x="620" y="562" font-size="12" font-weight="normal" fill="#B35C00" text-anchor="start">Not controlled: reasoning effort (default (run 1) → low (later runs))</text><text xml:space="preserve" x="620" y="580" font-size="12" font-weight="normal" fill="#B35C00" text-anchor="start">Condition order was not randomised, so run date is confounded too.</text></svg>
