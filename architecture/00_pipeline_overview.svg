<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="656" viewBox="0 0 1000 656" font-family="Helvetica, Arial, sans-serif"><title>Pipeline overview</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1000" height="656" fill="#FFFFFF"/><text xml:space="preserve" x="30" y="40" font-size="22" font-weight="bold" fill="#222" text-anchor="start">Pipeline overview: from a run command to the report</text><rect x="60" y="64" width="880" height="74" rx="8" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.6"/><text xml:space="preserve" x="72" y="86" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start">1  Run command (run_setup_check.py)</text><text xml:space="preserve" x="72" y="106" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">• --scenario name=count (repeatable; order kept) · --prefill-source &lt;episodes.jsonl&gt; for prefilled scenarios</text><text xml:space="preserve" x="72" y="122" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">• --budget-usd (hard stop) · --reasoning-effort low / medium / high · --max-task-turns 25 · --seed (episode i uses seed + i)</text><line x1="500.0" y1="138" x2="500.0" y2="168" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="168" width="880" height="58" rx="8" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.6"/><text xml:space="preserve" x="72" y="190" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="start">2  Job list</text><text xml:space="preserve" x="72" y="210" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">• On-policy scenario: count episodes. Prefilled scenario: count continuations × every source history that received the file.</text><line x1="500.0" y1="226" x2="500.0" y2="256" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="256" width="880" height="74" rx="8" fill="#FDF1E4" stroke="#C77F00" stroke-width="1.6"/><text xml:space="preserve" x="72" y="278" font-size="14" font-weight="bold" fill="#C77F00" text-anchor="start">3  One episode per job (episode_runner.py)</text><text xml:space="preserve" x="72" y="298" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">• On-policy: task loop with tools in an in-memory workspace → access log → report question on 2 paired branches → labels.</text><text xml:space="preserve" x="72" y="314" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">• Prefilled: replay a saved trajectory under the scenario&#x27;s prompts → rebuilt access log → same report phase and labels.</text><line x1="500.0" y1="330" x2="500.0" y2="360" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="360" width="880" height="74" rx="8" fill="#F7ECF3" stroke="#B8579A" stroke-width="1.6"/><text xml:space="preserve" x="72" y="382" font-size="14" font-weight="bold" fill="#B8579A" text-anchor="start">4  Model calls (openrouter_client.py)</text><text xml:space="preserve" x="72" y="402" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">• qwen/qwen3.8-27b, provider pinned (deepinfra, no fallbacks), reasoning on, usage/cost returned per call.</text><text xml:space="preserve" x="72" y="418" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">• BudgetTracker checks the limit before every call · 300 s request timeout, 2 retries · API errors are recorded, the run continues.</text><line x1="500.0" y1="434" x2="500.0" y2="464" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="464" width="880" height="58" rx="8" fill="#E9F5EF" stroke="#009E73" stroke-width="1.6"/><text xml:space="preserve" x="72" y="486" font-size="14" font-weight="bold" fill="#009E73" text-anchor="start">5  Logs per run (results/&lt;timestamp&gt;/)</text><text xml:space="preserve" x="72" y="506" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">• run_config.json · episodes.jsonl (appended after each episode) · transcripts (.md and .html) · summary.md and .html</text><line x1="500.0" y1="522" x2="500.0" y2="552" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="552" width="880" height="74" rx="8" fill="#FFFFFF" stroke="#888888" stroke-width="1.6"/><text xml:space="preserve" x="72" y="574" font-size="14" font-weight="bold" fill="#888888" text-anchor="start">6  Report (build_pilot_report.py)</text><text xml:space="preserve" x="72" y="594" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">• Loads all listed runs → tables + Figure 1 (Wilson 95% intervals) → fills reports/templates/pilot_report_template.md</text><text xml:space="preserve" x="72" y="610" font-size="12.5" font-weight="normal" fill="#222" text-anchor="start">• → reports/pilot_report_&lt;date&gt;.md and a self-contained .html</text></svg>
