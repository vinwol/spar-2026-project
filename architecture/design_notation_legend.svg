<svg xmlns="http://www.w3.org/2000/svg" width="370" height="955" viewBox="0 0 370 955" font-family="Helvetica, Arial, sans-serif"><title>Minimal design notation: legend</title><defs><marker id="legend-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="370" height="955" fill="#FFFFFF"/><rect x="20" y="20" width="330" height="915" rx="10" fill="#FAFAFA" stroke="#999999"/><text xml:space="preserve" x="36" y="46" font-size="15" font-weight="bold" fill="#222" text-anchor="start">Legend</text><text xml:space="preserve" x="36" y="78" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="start">Conditions and roles</text><rect x="40" y="97.0" width="64" height="28" rx="5" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text xml:space="preserve" x="74" y="116" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">name</text><rect x="32" y="88.0" width="22" height="18" rx="9" fill="#222222"/><text xml:space="preserve" x="43" y="101" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">T</text><text xml:space="preserve" x="124" y="114" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Condition (arm); badge = role</text><text xml:space="preserve" x="36" y="140" font-size="10" font-weight="normal" fill="#666666" text-anchor="start">T treatment · C− comparison condition (e.g.</text><text xml:space="preserve" x="36" y="153" font-size="10" font-weight="normal" fill="#666666" text-anchor="start">access permitted) · C+ check that the measurement</text><text xml:space="preserve" x="36" y="166" font-size="10" font-weight="normal" fill="#666666" text-anchor="start">works · B baseline</text><rect x="44" y="191.0" width="26.8" height="20" rx="10" fill="#FFFFFF" stroke="#222222"/><text xml:space="preserve" x="57" y="205" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">×5</text><text xml:space="preserve" x="124" y="205" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Replicates (units per condition)</text><rect x="44" y="231.0" width="26.8" height="20" rx="10" fill="#FFFFFF" stroke="#222222"/><text xml:space="preserve" x="57" y="245" font-size="11" font-weight="bold" fill="#222" text-anchor="middle">¬R</text><text xml:space="preserve" x="124" y="245" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Not randomised (R = randomised)</text><text xml:space="preserve" x="36" y="275" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="start">Factors</text><polygon points="52,290.0 92,290.0 104,307.0 92,324.0 52,324.0 40,307.0" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text xml:space="preserve" x="72" y="308" font-size="12" font-weight="bold" fill="#222" text-anchor="middle"></text><text xml:space="preserve" x="72" y="323" font-size="10.5" font-weight="normal" fill="#666666" text-anchor="middle"></text><text xml:space="preserve" x="124" y="311" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Manipulated factor, with its levels</text><polygon points="52,330.0 92,330.0 104,347.0 92,364.0 52,364.0 40,347.0" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text xml:space="preserve" x="72" y="348" font-size="12" font-weight="bold" fill="#222" text-anchor="middle"></text><text xml:space="preserve" x="72" y="363" font-size="10.5" font-weight="normal" fill="#666666" text-anchor="middle"></text><line x1="84" y1="336.0" x2="84" y2="350.0" stroke="#222222" stroke-width="2"/><line x1="89" y1="336.0" x2="89" y2="350.0" stroke="#222222" stroke-width="2"/><text xml:space="preserve" x="124" y="344" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Paired factor: varied within each</text><text xml:space="preserve" x="124" y="358" font-size="11" font-weight="normal" fill="#222" text-anchor="start">unit</text><polygon points="52,370.0 92,370.0 104,387.0 92,404.0 52,404.0 40,387.0" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3"/><text xml:space="preserve" x="72" y="388" font-size="12" font-weight="bold" fill="#222" text-anchor="middle"></text><text xml:space="preserve" x="72" y="403" font-size="10.5" font-weight="normal" fill="#666666" text-anchor="middle"></text><text xml:space="preserve" x="124" y="391" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Held fixed (controlled by design)</text><polygon points="52,410.0 92,410.0 104,427.0 92,444.0 52,444.0 40,427.0" fill="#FFFFFF" stroke="#C77F00" stroke-width="1.5"/><text xml:space="preserve" x="72" y="428" font-size="12" font-weight="bold" fill="#222" text-anchor="middle"></text><text xml:space="preserve" x="72" y="443" font-size="10.5" font-weight="normal" fill="#666666" text-anchor="middle"></text><polygon points="82,418.0 91,402.0 100,418.0" fill="#C77F00"/><text xml:space="preserve" x="91" y="416" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text><text xml:space="preserve" x="124" y="431" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Confounded: varied, not controlled</text><text xml:space="preserve" x="36" y="461" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="start">Flow</text><polygon points="50,477.0 104,477.0 94,509.0 40,509.0" fill="#E8F1FA" stroke="#0072B2" stroke-width="1.5"/><text xml:space="preserve" x="72" y="497" font-size="11" font-weight="normal" fill="#222" text-anchor="middle">text</text><text xml:space="preserve" x="124" y="497" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Stimulus: prompt or question</text><rect x="56" y="518.0" width="30" height="30" rx="7" fill="#FDF1E4" stroke="#C77F00" stroke-width="1.5"/><text xml:space="preserve" x="71" y="538" font-size="14" font-weight="bold" fill="#C77F00" text-anchor="middle">M</text><text xml:space="preserve" x="124" y="537" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Model acts (stochastic)</text><polygon points="85.0,573.0 80.2,576.8 80.9,582.9 74.8,582.2 71.0,587.0 67.2,582.2 61.1,582.9 61.8,576.8 57.0,573.0 61.8,569.2 61.1,563.1 67.2,563.8 71.0,559.0 74.8,563.8 80.9,563.1 80.2,569.2" fill="#F2F2F2" stroke="#666666" stroke-width="1.4"/><circle cx="71" cy="573.0" r="4" fill="#FFFFFF" stroke="#666666" stroke-width="1.2"/><text xml:space="preserve" x="124" y="577" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Harness acts (deterministic code)</text><circle cx="71" cy="613.0" r="16" fill="#E9F5EF" stroke="#009E73" stroke-width="1.5"/><text xml:space="preserve" x="69" y="618" font-size="13" font-weight="bold" fill="#009E73" text-anchor="middle">O</text><text xml:space="preserve" x="78" y="622" font-size="9" font-weight="bold" fill="#009E73" text-anchor="start">1</text><text xml:space="preserve" x="124" y="617" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Measurement (observation)</text><line x1="62" y1="637.0" x2="62" y2="669.0" stroke="#222222" stroke-width="1.6"/><polygon points="62,637.0 84,644.0 62,651.0" fill="#D55E00"/><text xml:space="preserve" x="124" y="657" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Endpoint: the primary outcome</text><rect x="42" y="678.0" width="60" height="30" rx="4" fill="none" stroke="#666666" stroke-width="1.3"/><rect x="46" y="682.0" width="52" height="22" rx="4" fill="none" stroke="#666666" stroke-width="1.3"/><text xml:space="preserve" x="124" y="697" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Analysis / estimand</text><text xml:space="preserve" x="36" y="727" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="start">Relations</text><line x1="40" y1="759.0" x2="100" y2="759.0" stroke="#444" stroke-width="1.6" marker-end="url(#legend-arrow)"/><text xml:space="preserve" x="124" y="763" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Precedes / produces</text><line x1="40" y1="799.0" x2="102" y2="799.0" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 3" marker-start="url(#legend-arrow)" marker-end="url(#legend-arrow)"/><rect x="60.0" y="790.0" width="22" height="17" rx="8" fill="#FFFFFF" stroke="#222222"/><text xml:space="preserve" x="71" y="803" font-size="10.5" font-weight="bold" fill="#222" text-anchor="middle">vs</text><text xml:space="preserve" x="124" y="796" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Compared with (e.g. treatment vs</text><text xml:space="preserve" x="124" y="810" font-size="11" font-weight="normal" fill="#222" text-anchor="start">control)</text><line x1="40" y1="839.0" x2="100" y2="839.0" stroke="#444" stroke-width="1.6" marker-end="url(#legend-arrow)"/><text xml:space="preserve" x="70" y="833" font-size="10.5" font-weight="normal" fill="#222" text-anchor="middle">+ x</text><text xml:space="preserve" x="124" y="836" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Intended one-change step</text><text xml:space="preserve" x="124" y="850" font-size="11" font-weight="normal" fill="#222" text-anchor="start">(escalation step)</text><line x1="66" y1="867.0" x2="66" y2="891.0" stroke="#222222" stroke-width="2"/><line x1="71" y1="867.0" x2="71" y2="891.0" stroke="#222222" stroke-width="2"/><text xml:space="preserve" x="124" y="883" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Paired: same unit, both levels</text><rect x="40" y="903.0" width="62" height="32" rx="12" fill="none" stroke="#666666" stroke-width="1.4" stroke-dasharray="7 4"/><text xml:space="preserve" x="52" y="919" font-size="11" font-weight="bold" fill="#666666" text-anchor="start"></text><text xml:space="preserve" x="124" y="916" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Unit: everything inside is nested</text><text xml:space="preserve" x="124" y="930" font-size="11" font-weight="normal" fill="#222" text-anchor="start">in it</text></svg>
